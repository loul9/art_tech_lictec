<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Circuitos básicos AR/VR</title>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
  /* ... (Aquí va TODO tu CSS original intacto) ... */
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#18233f,#070a14);font-family:system-ui,sans-serif;color:#fff;touch-action:none}
  #video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4}
  .label{position:absolute;transform:translate(-50%,-100%);background:rgba(15,23,42,.9);border:1px solid #38bdf8;color:#fff;font-size:13px;padding:4px 9px;border-radius:8px;white-space:nowrap;pointer-events:auto;cursor:pointer;display:none}
  .label.sel{background:#0891b2;border-color:#fff}
  #ui{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:6}
  button,.btn{background:#1d4ed8;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
  button.off{background:#334155} button.act{background:#0e9f6e}
  #info{position:fixed;left:8px;right:8px;bottom:8px;background:rgba(15,23,42,.92);border-radius:14px;padding:12px 14px;z-index:6;max-width:560px}
  #info h2{margin:0 0 4px;font-size:18px} #info p{margin:3px 0;font-size:14px;line-height:1.35}
  #ctl{position:fixed;right:10px;top:70px;z-index:6;background:rgba(15,23,42,.75);padding:8px 10px;border-radius:10px;font-size:12px}
  #ctl input{width:120px}
  #cursor{position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid #22d3ee;border-radius:50%;pointer-events:none;display:none;z-index:7}
  #cursor.pinch{background:#22d3ee}
  #status{position:fixed;top:56px;left:10px;font-size:12px;opacity:.85;z-index:6;max-width:60%}
  #start{position:fixed;inset:0;background:#0b1020;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  #start p{max-width:460px;opacity:.85;line-height:1.4}
  body.vr #ui,body.vr #info,body.vr #status,body.vr #ctl,body.vr #labels{display:none}
  #exitvr{display:none;position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9;opacity:.6}
  body.vr #exitvr{display:block}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="cursor"></div>
<div id="status"></div>

<div id="ui">
  <!-- Botones de artefactos (como en tu captura) -->
  <button id="bArt1" class="act">🔦 Linterna</button>
  <button id="bArt2">🔔 Timbre</button>
  <button id="bArt3">🌀 Ventilador</button>
  
  <button id="bCirc">⚡ Cerrar circuito</button>
  <button id="bTr">👁 Carcasa transparente</button>
  <button id="bAR">📷 AR + manos: OFF</button>
  <button id="bVR">🥽 VR</button>
  <label class="btn" style="background:#7c3aed">📦 Mi modelo .glb<input type="file" id="glb" accept=".glb,.gltf" hidden></label>
</div>

<div id="ctl">Separar partes<br><input type="range" id="exp" min="0" max="1" step="0.01" value="0"></div>
<button id="exitvr">Salir de VR</button>
<div id="info"></div>

<div id="start">
  <h1>🔌 Circuitos básicos de artefactos</h1>
  <p>Linterna, timbre y ventilador en 3D con realidad aumentada y VR.<br>
  <b>✋ Mano abierta</b> = separa las partes · <b>✊ Puño</b> = las junta · mueve la mano para desplazar el objeto · <b>👌 pellizco</b> sobre una parte para ver su función.</p>
  <button id="go" style="font-size:18px;padding:14px 26px;margin-top:14px">Comenzar</button>
</div>

<!-- AQUI VA TU BASE64 ORIGINAL (No lo borres) -->
<script type="application/json" id="glb-data">{"linterna": {"carcasa": "Z2xURgIA..."}} </script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

// =====================================================================
// 1. CONFIGURACIÓN DE PIEZAS (AQUÍ VINCULAS TUS MODELOS .GLB)
// =====================================================================
// Define aquí cómo se separa la linterna. 
// "posicionBase" es donde está ensamblada. 
// "posicionExplotada" es a donde se mueve cuando usas el slider.
const CONFIG_PIEZAS = {
  linterna: {
    nombre: "Linterna de mano",
    descripcion: "Circuito: pila (+) → interruptor → LED → pila (-)",
    piezas: [
      { id: 'bateria',    ruta: 'modelos/linterna/bateria.glb',    base: [0, 0, -0.2], exp: [0, -0.5, -0.2], funcion: "Almacena energía química." },
      { id: 'bombillo',   ruta: 'modelos/linterna/bombillo.glb',   base: [0, 0, 0.2],  exp: [0, 0, 0.6],     funcion: "Convierte energía eléctrica en luz." },
      { id: 'interruptor',ruta: 'modelos/linterna/interruptor.glb',base: [0, 0.1, 0],  exp: [0, 0.6, 0],     funcion: "Abre o cierra el circuito." },
      { id: 'carcasa',    ruta: 'modelos/linterna/carcasa.glb',    base: [0, 0, 0],    exp: [0, 0.3, 0],     funcion: "Protege los componentes." },
      { id: 'lente',      ruta: 'modelos/linterna/lente.glb',      base: [0, 0, 0.3],  exp: [0, 0, 0.9],     funcion: "Concentra la luz." }
    ]
  },
  // Aquí irían el timbre y el ventilador...
};

// =====================================================================
// 2. INICIALIZACIÓN DE LA ESCENA (TU CÓDIGO ORIGINAL ADAPTADO)
// =====================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 0.5, 2.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// Luces (las mismas que tenías)
scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
dirLight.position.set(2, 3, 2);
scene.add(dirLight);

// =====================================================================
// 3. LÓGICA DE CARGA Y ENSAMBLAJE (LA MAGIA NUEVA)
// =====================================================================
const gltfLoader = new GLTFLoader();
let grupoActual = new THREE.Group();
scene.add(grupoActual);
let piezasCargadas = []; // Guarda referencia a cada mesh y sus posiciones

const sliderExp = document.getElementById('exp');
const infoDiv = document.getElementById('info');

async function cargarArtefacto(nombreArtefacto) {
  // 1. Limpiar escena anterior
  while(grupoActual.children.length > 0){ 
    const child = grupoActual.children[0];
    grupoActual.remove(child); 
  }
  piezasCargadas = [];

  const config = CONFIG_PIEZAS[nombreArtefacto];
  if (!config) return;

  infoDiv.innerHTML = `<h2>${config.nombre}</h2><p>${config.descripcion}</p>`;

  // 2. Cargar cada pieza .glb (o clonar la original si no existe el archivo)
  for (const def of config.piezas) {
    try {
      // Intentamos cargar el modelo específico de la pieza
      const gltf = await new Promise((resolve, reject) => gltfLoader.load(def.ruta, resolve, undefined, reject));
      
      const mesh = gltf.scene;
      mesh.userData = { 
        id: def.id, 
        funcion: def.funcion,
        posBase: new THREE.Vector3(...def.base),
        posExp: new THREE.Vector3(...def.exp)
      };
      
      mesh.position.copy(mesh.userData.posBase);
      grupoActual.add(mesh);
      piezasCargadas.push(mesh);

    } catch (e) {
      console.warn(`No se encontró ${def.ruta}, usando modelo fallback...`);
      // FALLBACK: Si no tienes las piezas separadas, usa tu modelo original de base64.
      // (Esto es para que no se rompa si no has separado los .glb todavía).
      // Se puede implementar la lógica de decodificar tu base64 original aquí.
    }
  }
  
  // Actualizar slider
  sliderExp.value = 0;
  actualizarExplosion(0);
}

// 3. Función para el Slider (explosión)
function actualizarExplosion(t) {
  piezasCargadas.forEach(pieza => {
    // Interpola entre la posición base y la posición explotada
    pieza.position.lerpVectors(pieza.userData.posBase, pieza.userData.posExp, t);
  });
}

sliderExp.addEventListener('input', (e) => {
  actualizarExplosion(parseFloat(e.target.value));
});

// =====================================================================
// 4. INTERACCIÓN (Raycasting para mostrar info)
// =====================================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

canvas.addEventListener('pointerdown', (e) => {
  // Solo si no es VR ni estamos arrastrando
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(grupoActual.children, true);

  if (intersects.length > 0) {
    let obj = intersects[0].object;
    while(obj.parent && !obj.userData.id) obj = obj.parent; // Encontrar la pieza raíz
    
    if (obj.userData.id) {
      const config = CONFIG_PIEZAS['linterna']; // o el artefacto actual
      infoDiv.innerHTML = `
        <h2 style="color: #38bdf8">${obj.userData.id.toUpperCase()}</h2>
        <p><b>Función:</b> ${obj.userData.funcion}</p>
      `;
    }
  }
});

// =====================================================================
// 5. BUCLE DE RENDER Y EVENTOS
// =====================================================================
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

// Lógica de botones UI
document.getElementById('go').addEventListener('click', () => {
  document.getElementById('start').style.display = 'none';
  // Carga inicial
  cargarArtefacto('linterna');
});

document.getElementById('bArt1').addEventListener('click', () => cargarArtefacto('linterna'));
// document.getElementById('bArt2').addEventListener('click', () => cargarArtefacto('timbre'));
// document.getElementById('bArt3').addEventListener('click', () => cargarArtefacto('ventilador'));

</script>
</body>
</html>
