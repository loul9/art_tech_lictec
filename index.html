<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Circuitos básicos AR/VR — MEN 2022</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<video id="video" playsinline muted></video>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="cursor"></div>
<div id="status"></div>

<div id="ui">
  <span id="devBtns" style="display:contents"></span>
  <button id="bCirc">⚡ Cerrar circuito</button>
  <button id="bTr">👁 Carcasa transparente</button>
  <button id="bAR">📷 AR + manos: ON</button>
  <button id="bVR">🥽 VR</button>
  <label class="btn" style="background:#7c3aed">
    📦 Mi modelo .glb
    <input type="file" id="glb" accept=".glb,.gltf" hidden>
  </label>
</div>

<div id="ctl">
  Separar partes<br>
  <input type="range" id="exp" min="0" max="1" step="0.01" value="0">
</div>

<button id="exitvr">Salir de VR</button>
<div id="info"></div>

<div id="start">
  <h1>🔌 Circuitos básicos de artefactos</h1>
  <p>
    Linterna, timbre y ventilador en 3D con realidad aumentada y VR.<br>
    <b>✋ Mano abierta</b> = separa las partes · <b>✊ Puño</b> = las junta ·
    mueve la mano para desplazar el objeto · <b>👌 pellizco</b> sobre una parte
    para ver su función.
  </p>
  <button id="go" style="font-size:18px;padding:14px 26px;margin-top:14px">
    Comenzar
  </button>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
